general:
        folder_output: outputs
        fname_output: refturb_output
design_variables:

    tower:
        outer_diameter:
            flag: True
            lower_bound: 3.87
            upper_bound: 8.0
        layer_thickness:
            flag: True
            lower_bound: 4e-3
            upper_bound: 2e-1
    monopile:
        outer_diameter:
            flag: True
            lower_bound: 3.87
            upper_bound: 8.0
        layer_thickness:
            flag: True
            lower_bound: 4e-3
            upper_bound: 2e-1
        height:
            flag: True
            lower_bound: 40.0
            upper_bound: 120.0

merit_figure: structural_mass

constraints:
    tower:
        height_constraint:
            flag: False
            lower_bound: 1.e-2
            upper_bound: 1.e-2
        stress:
            flag: True
        global_buckling:
            flag: True
        shell_buckling:
            flag: True
        d_to_t:
            flag: False
            lower_bound: 120.0
            upper_bound: 2000.0
        taper:
            flag: False
            lower_bound: 0.2
        slope:
            flag: True
        frequency_1:
            flag: False
            lower_bound: 0.13
            upper_bound: 0.40
    monopile:
        stress:
            flag: True
        global_buckling:
            flag: True
        shell_buckling:
            flag: True
        d_to_t:
            flag: False
            lower_bound: 120.0
            upper_bound: 2000.0
        taper:
            flag: False
            lower_bound: 0.2
        slope:
            flag: True
        thickness_slope:
            flag: True
        frequency_1:
            flag: True
            lower_bound: 0.13
            upper_bound: 0.20
        pile_depth:
            flag: True
            lower_bound: 20.0
        tower_diameter_coupling:
            flag: True
        height_airgap:
            flag: True
            air_gap: 1.5
            safety_margin: 4.0

driver:
    optimization:
        flag: True
        tol: 1.e-6
        max_major_iter: 1000
        max_minor_iter: 100
        max_iter: 50
        solver: SLSQP
        step_size: 1.e-3
        form: forward
    design_of_experiments:
        flag: False
        run_parallel: True
        generator: Uniform
        num_samples: 5

recorder:
    flag: False
    file_name: log_opt.sql
