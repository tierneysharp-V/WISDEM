general:
        folder_output: outputs
        fname_output: refturb_output
design_variables:

    tower:
        outer_diameter:
            flag: False
            lower_bound: 3.87
            upper_bound: 8.0
        layer_thickness:
            flag: False
            lower_bound: 4e-3
            upper_bound: 2e-1
    monopile:
        outer_diameter:
            flag: True
            uniform: True
            # Runtime floor raised to tower base (diameter coupling) in run_foundation_batch
            lower_bound: 3.87
            upper_bound: 16.0
        layer_thickness:
            flag: True
            uniform: True
            # Runtime floor: D/120 at D DV lower bound in run_foundation_batch
            lower_bound: 5e-2
            upper_bound: 2e-1
        # Height fixed by apply_wt_geometry_rules (H_free + L_emb); optimise D/t only
        height:
            flag: False
            lower_bound: 40.0
            upper_bound: 150.0
merit_figure: monopile_mass

constraints:
    tower:
        height_constraint:
            flag: False
            lower_bound: 1.e-2
            upper_bound: 1.e-2
        # Off: foundation-only sizing; tower is not a DV
        stress:
            flag: False
        global_buckling:
            flag: False
        shell_buckling:
            flag: False
        d_to_t:
            flag: False
            lower_bound: 120.0
            upper_bound: 2000.0
        taper:
            flag: False
            lower_bound: 0.2
        # Tower is not a DV; slope constraint is redundant for this batch
        slope:
            flag: False
        frequency_1:
            flag: False
            lower_bound: 0.13
            upper_bound: 0.40
    monopile:
        stress:
            flag: True
        global_buckling:
            flag: True
        shell_buckling:
            flag: True
        d_to_t:
            flag: True
            lower_bound: 1.0
            upper_bound: 150.0
        taper:
            flag: False
            lower_bound: 0.2
        # Uniform prismatic D/t — slope constraints always satisfied
        slope:
            flag: False
        thickness_slope:
            flag: False
        frequency_1:
            flag: True
            # Runtime-patched by run_foundation_batch from turbine min/max rpm (or TSR/cut-in/out)
            lower_bound: 0.22
            upper_bound: 0.35
        # Embedment/freeboard height applied post-opt via geometry rules (not opt constraints)
        pile_depth:
            flag: False
        wall_thickness_min:
            flag: True
        tower_diameter_coupling:
            flag: True
        height_airgap:
            flag: False

driver:
    optimization:
        flag: True
        tol: 1.e-4
        max_major_iter: 1000
        max_minor_iter: 100
        max_iter: 100
        solver: SLSQP
        # Slightly larger FD step for stabler soil-spring + frequency gradients
        step_size: 1.e-5
        form: central
    design_of_experiments:
        flag: False
        run_parallel: True
        generator: Uniform
        num_samples: 5

recorder:
    flag: False
    file_name: log_opt.sql
